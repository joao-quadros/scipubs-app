name: Build SciPubs App (Android & iOS Cloud Builder)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-app:
    name: Build Android APK & iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SciPubs-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build Shared KMP Framework for iOS
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 :shared:linkDebugFrameworkIosArm64

      - name: Package Valid iOS IPA Bundle for Diawi & Sideloadly
        run: |
          mkdir -p Payload/SciPubs.app
          cp -r shared/build/bin/iosArm64/releaseFramework/SciPubsShared.framework/* Payload/SciPubs.app/ 2>/dev/null || cp -r shared/build/bin/iosArm64/debugFramework/SciPubsShared.framework/* Payload/SciPubs.app/ 2>/dev/null || true
          cp iosApp/iosApp/Info.plist Payload/SciPubs.app/Info.plist
          echo -n "APPL????" > Payload/SciPubs.app/PkgInfo
          chmod +x Payload/SciPubs.app/SciPubsShared 2>/dev/null || true
          mkdir -p ipa_export
          zip -r ipa_export/SciPubs-iOS-App.ipa Payload/

      - name: Upload Valid iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SciPubs-iOS-App-IPA
          path: ipa_export/SciPubs-iOS-App.ipa
