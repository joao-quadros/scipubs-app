name: Build iOS App (SciPubs)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Framework & App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SciPubs-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build Shared KMP Framework for iOS
        run: ./gradlew :shared:embedAndSignAppleFrameworkForXcode

      - name: Upload iOS Framework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SciPubs-iOS-Framework
          path: shared/build/bin/iosArm64/
