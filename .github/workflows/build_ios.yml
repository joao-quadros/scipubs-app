name: Build SciPubs App (Android & iOS Cloud Builder)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-app:
    name: Build Android APK & iOS Assets
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --continue || true

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SciPubs-Android-APK
          path: app/build/outputs/apk/**/*.apk

      - name: Package Source & iOS Assets
        run: |
          mkdir -p ios_export
          zip -r ios_export/SciPubs-iOS-Source.zip app/src/main/java/ assets/ README.md build.gradle.kts settings.gradle.kts

      - name: Upload iOS Assets & Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SciPubs-iOS-Bundle
          path: ios_export/SciPubs-iOS-Source.zip
